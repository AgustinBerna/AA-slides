name: Publicar AA-slides en GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aa-slides-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar presentación
        id: deployment
        uses: actions/deploy-pages@v4
